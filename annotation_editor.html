<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>纪念币标记编辑器</title>
  <link rel="stylesheet" href="annotations/editor.css">
</head>
<body>
  <div id="localOnlyNotice" class="local-only-notice" hidden>
    标记编辑器仅允许在 localhost、127.0.0.1 或本地文件中使用。
  </div>

  <div id="editorApp" class="app-shell">
    <header class="topbar">
      <div>
        <h1>纪念币标记编辑器</h1>
        <p>拖动区域调整位置，拖动控制点调整大小；所有坐标均按图片比例保存。</p>
      </div>
      <div class="topbar-actions">
        <span id="serverBadge" class="badge badge-muted">检测保存服务…</span>
        <a class="button button-ghost" href="/" target="_blank" rel="noopener">打开收藏网站</a>
      </div>
    </header>

    <section class="toolbar panel">
      <button id="prevCoinBtn" class="icon-button" title="上一枚">←</button>
      <label class="field coin-picker">
        <span>币种</span>
        <select id="coinSelect"></select>
      </label>
      <button id="nextCoinBtn" class="icon-button" title="下一枚">→</button>
      <div id="faceTabs" class="face-tabs" role="tablist" aria-label="币面">
        <button type="button" data-face="f" class="active">f · 第一图</button>
        <button type="button" data-face="b">b · 第二图</button>
      </div>
      <span id="dirtyBadge" class="badge badge-muted">未修改</span>
      <span class="toolbar-spacer"></span>
      <button id="undoBtn" class="button button-ghost" disabled>撤销</button>
      <button id="redoBtn" class="button button-ghost" disabled>重做</button>
      <button id="reloadBtn" class="button button-ghost">从文件重载</button>
      <button id="copyBtn" class="button button-ghost">复制 JSON</button>
      <button id="downloadBtn" class="button button-ghost">下载 JSON</button>
      <button id="saveBtn" class="button button-primary" disabled>保存到项目</button>
    </section>

    <main class="editor-layout">
      <section class="canvas-panel panel">
        <div class="canvas-header">
          <div>
            <strong id="coinTitle">加载中…</strong>
            <span id="coinMeta"></span>
          </div>
          <div class="canvas-options">
            <label class="check-field">
              <input id="showAllRegions" type="checkbox">
              <span>显示全部标记</span>
            </label>
            <label class="field compact-field">
              <span>遮罩</span>
              <input id="overlayOpacity" type="range" min="0" max="0.7" step="0.05" value="0.18">
            </label>
          </div>
        </div>

        <div id="emptyState" class="empty-state" hidden>
          <strong>这枚币还没有标记 JSON</strong>
          <span>后续生成数据后即可在这里调整。</span>
        </div>

        <div id="stageViewport" class="stage-viewport">
          <div id="imageStage" class="image-stage">
            <img id="coinImage" alt="当前币面">
            <svg id="editorOverlay" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-label="可编辑标记区域"></svg>
          </div>
        </div>

        <label class="description-card">
          <span id="faceName" class="face-name"></span>
          <span class="description-edit-area">
            <textarea id="faceDescription" rows="3" aria-label="当前币面描述"></textarea>
            <small>这里可直接修正币面描述；保存时会与标记 JSON 一并写入 coin_data.json。</small>
          </span>
        </label>

        <div class="shortcut-help">
          <span>拖动区域：移动</span>
          <span>拖动圆点：缩放/改顶点</span>
          <span>方向键：移动 0.5%</span>
          <span>Shift：改为 2%</span>
          <span>Alt + 方向键：调整宽高</span>
          <span>Ctrl/⌘ + S：保存</span>
        </div>
      </section>

      <aside class="inspector panel">
        <section class="inspector-section">
          <div class="section-heading">
            <h2>文字标记</h2>
            <button id="addItemBtn" class="text-button">＋新增</button>
          </div>
          <p class="section-hint">可先在图片下方的币面描述中选中文字，再点“新增”；整条错误标记可在下方删除。修改描述后，请同步修正受影响标记的原文。</p>
          <div id="itemList" class="item-list"></div>
        </section>

        <section id="itemEditor" class="inspector-section" hidden>
          <div class="section-heading">
            <h2>当前标记</h2>
            <div class="item-order-actions" aria-label="调整当前标记顺序">
              <button id="moveItemUpBtn" class="text-button" title="将当前标记上移一位">↑ 上移</button>
              <button id="moveItemDownBtn" class="text-button" title="将当前标记下移一位">↓ 下移</button>
              <button id="deleteItemBtn" class="text-button danger">删除标记</button>
            </div>
          </div>
          <label class="field">
            <span>描述中的原文</span>
            <input id="quoteInput" type="text">
          </label>
          <label class="field">
            <span>图中位置名称</span>
            <input id="labelInput" type="text">
          </label>
        </section>

        <section id="regionEditor" class="inspector-section" hidden>
          <div class="section-heading">
            <h2>区域</h2>
            <span id="regionCounter" class="muted"></span>
          </div>
          <div id="regionList" class="region-list"></div>
          <div class="add-region-row">
            <button type="button" data-add-region="rect" class="button button-ghost">＋矩形</button>
            <button type="button" data-add-region="ellipse" class="button button-ghost">＋椭圆</button>
            <button type="button" data-add-region="polygon" class="button button-ghost">＋多边形</button>
          </div>
          <div id="numericFields" class="numeric-grid"></div>
          <div class="nudge-grid" aria-label="微调区域">
            <button type="button" disabled>—</button>
            <button type="button" data-nudge="up">上移</button>
            <button type="button" data-scale="grow-y">加高</button>
            <button type="button" data-nudge="left">左移</button>
            <button type="button" data-scale="shrink">缩小</button>
            <button type="button" data-nudge="right">右移</button>
            <button type="button" data-scale="shrink-y">减高</button>
            <button type="button" data-nudge="down">下移</button>
            <button type="button" data-scale="grow">放大</button>
          </div>
          <button id="deleteRegionBtn" class="button button-danger">删除当前区域</button>
        </section>

        <section class="inspector-section review-section">
          <button id="reviewBtn" class="button button-review">标记本面已审核</button>
          <span id="reviewProgress" class="muted"></span>
        </section>

        <section class="inspector-section feedback-section">
          <div class="section-heading"><h2>反馈摘要</h2></div>
          <textarea id="feedbackText" rows="4" readonly></textarea>
          <button id="copyFeedbackBtn" class="button button-ghost">复制当前区域说明</button>
        </section>
      </aside>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="annotations/annotation_generator.js"></script>
  <script src="annotations/editor.js"></script>
</body>
</html>
